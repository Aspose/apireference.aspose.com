baseURL = "https://reference.aspose.com/words"

# Aspose RefPilot (Get API Help). Root-level dotted keys: they must stay above the first
# [table] header or they would land inside it. English Words .NET pages only (the theme
# enforces both). Off switch: remove the endpoint line or set platforms.net = false.
params.referenceAssistantEndpoint = "https://refpilot.aspose.com"
params.referenceAssistantPlatforms.net = true
params.referenceAssistantPrefetchFollowUps = 1

# Google Tag Manager settings
[params.gtm]
gtm_id = "GTM-NJMHSH"

[[deployment.targets]]
name = "Production"
URL = "s3://reference.aspose.com/?prefix=words/&region=us-west-2"
