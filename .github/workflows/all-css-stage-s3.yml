name: All CSS Staging Workflows (S3)

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build-css-english-stage
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-css-english-stage.yml
          token: ${{ secrets.REPO_TOKEN }}
