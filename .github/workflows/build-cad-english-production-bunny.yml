name: Build CAD English Production (BunnyCDN)

on:
  repository_dispatch:
    types: [ build-cad-english-production ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-production-bunny.yml
    with:
      product_repo: "aspose-cad/Aspose.CAD-API-References"
      product_name: "cad"
      disable_languages: '["ru","zh"]'
      theme_ref: "beta"
    secrets: inherit
