name: Build CAD Chinese Stage (BunnyCDN)

on:
  repository_dispatch:
    types: [ build-cad-chinese-stage ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-stage-bunny.yml
    with:
      product_repo: "aspose-cad/Aspose.CAD-API-References"
      product_name: "cad"
      disable_languages: '["en","ru"]'
      theme_ref: "beta"
    secrets: inherit
