name: All CAD-PYTHON-NET Production Workflows (BunnyCDN)

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build-cad-python-net-english-production-bunny
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-cad-python-net-english-production-bunny.yml
          token: ${{ secrets.REPO_TOKEN }}
