name: All CAD Production Workflows (S3)

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build-cad-chinese-production
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-cad-chinese-production.yml
          token: ${{ secrets.REPO_TOKEN }}

      - name: Trigger build-cad-english-production
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-cad-english-production.yml
          token: ${{ secrets.REPO_TOKEN }}

      - name: Trigger build-cad-russian-production
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-cad-russian-production.yml
          token: ${{ secrets.REPO_TOKEN }}
