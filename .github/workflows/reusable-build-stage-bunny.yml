name: Reusable Stage Build (BunnyCDN)

on:
  workflow_call:
    inputs:
      product_repo:
        required: true
        type: string
      product_name:
        required: true
        type: string
      disable_languages:
        required: true
        type: string
      theme_ref:
        required: false
        type: string
        default: main
    secrets:
      REPO_TOKEN:
        required: true
      CEPH_S3_QA_ACCESS_KEY:
        required: true
      CEPH_S3_QA_SECRET_KEY:
        required: true
      BUNNY_API_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hugo site
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Checkout theme
        uses: actions/checkout@v2
        with:
          repository: Aspose/api-theme
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ inputs.theme_ref }}
          fetch-depth: 1
          path: themes/api-theme

      - name: Checkout product content
        uses: actions/checkout@v2
        with:
          repository: ${{ inputs.product_repo }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          path: content/sites/aspose/${{ inputs.product_name }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install -D --save autoprefixer postcss-cli

      - name: Configure language
        run: |
          DEFAULT="config/sites/aspose/${{ inputs.product_name }}/_default/config.toml"
          STAGING="config/sites/aspose/${{ inputs.product_name }}/staging/config.toml"
          DISABLE_LANGS='${{ inputs.disable_languages }}'
          ALL_LANGS_TOML="[$(grep '\[languages\.' "$DEFAULT" | sed 's/.*\[languages\.\([a-z-]*\)\].*/\1/' | grep -v '^$' | awk '{printf "\"%s\",", $1}' | sed 's/,$//')]"
          DISABLE_LANGS_TOML="[$(echo "$DISABLE_LANGS" | tr -d '[]"' | tr ',' '\n' | sed 's/^[[:space:]]*//' | grep -v '^en$' | grep -v '^$' | awk '{printf "\"%s\",", $1}' | sed 's/,$//')]"
          { echo "defaultContentLanguageInSubdir = false"; echo ""; cat "$DEFAULT"; } > "${DEFAULT}.tmp" && mv "${DEFAULT}.tmp" "$DEFAULT"
          { echo "enableGitInfo = false"; echo "defaultContentLanguage = \"en\""; echo "defaultContentLanguageInSubdir = false"; echo "disableLanguages = ${DISABLE_LANGS_TOML}"; echo "params.allLangCodes = ${ALL_LANGS_TOML}"; echo ""; cat "$STAGING"; } > "${STAGING}.tmp" && mv "${STAGING}.tmp" "$STAGING"

      - name: Build
        run: hugo --configDir config/sites/aspose/${{ inputs.product_name }} --environment staging --minify

      - name: Sync to Ceph S3
        run: |
          # Each language builds on its own (English plus one language), so --delete must not
          # remove the folders of the languages this build does not produce.
          # The bucket path is the path of the site's baseURL (cells-python-net is served from
          # cells/python-net/, not cells-python-net/), so read it from the config.
          PREFIX=$(grep -m1 '^baseURL' "config/sites/aspose/${{ inputs.product_name }}/_default/config.toml" | sed 's#^baseURL *= *"##; s#".*$##; s#^[a-z]*://[^/]*##; s#^/##; s#/$##')
          [ -n "$PREFIX" ] || { echo "could not derive the bucket path from baseURL"; exit 1; }
          echo "bucket path: $PREFIX"
          EXCLUDES=()
          # barcode/javascript-cpp/ has no build of its own (it is a fixed copy), so keep --delete from removing it
          if [ "${{ inputs.product_name }}" = "barcode" ]; then EXCLUDES+=(--exclude "javascript-cpp/*"); fi
          for lang in $(echo '${{ inputs.disable_languages }}' | tr -d '[]" ' | tr ',' '\n' | grep -v '^en$' | grep -v '^$'); do
            EXCLUDES+=(--exclude "${lang}/*")
          done
          aws s3 sync ./public/ s3://qa-reference-aspose-com/${PREFIX}/ \
            --endpoint-url https://s3-qa.dynabic.com \
            --acl public-read \
            --delete \
            "${EXCLUDES[@]}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_S3_QA_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_S3_QA_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Purge BunnyCDN Cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          PREFIX=$(grep -m1 '^baseURL' "config/sites/aspose/${{ inputs.product_name }}/_default/config.toml" | sed 's#^baseURL *= *"##; s#".*$##; s#^[a-z]*://[^/]*##; s#^/##; s#/$##')
          [ -n "$PREFIX" ] || { echo "could not derive the purge path from baseURL"; exit 1; }
          code=$(curl -sS -o purge.out -w '%{http_code}' -G \
            -H "X-Api-Key: $BUNNY_API_KEY" \
            --data-urlencode "url=https://reference2.aspose.com/${PREFIX}/*" \
            "https://api.dynabic.com/bn/purge?async=true")
          cat purge.out; echo
          case "$code" in 2*) ;; *) echo "BunnyCDN purge failed: HTTP $code"; exit 1 ;; esac
