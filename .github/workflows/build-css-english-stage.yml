name: Build CSS English Stage

on:
  repository_dispatch:
    types: [ build-css-english-stage ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-stage.yml
    with:
      product_repo: "aspose-html/Aspose.CSS-References"
      product_name: "css"
      disable_languages: '[]'
      cf_path: "/css/*"
      theme_ref: "beta"
    secrets: inherit
